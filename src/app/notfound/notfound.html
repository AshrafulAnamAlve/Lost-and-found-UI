<div class="not-found-container">
  <div class="content">
    <div class="animation">
      <div class="magnifying-glass">
        <div class="lens"></div>
        <div class="handle"></div>
      </div>
      <div class="question">?</div>
    </div>

    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you are looking for does not exist or has been moved.</p>

    <a [routerLink]="signedIn ? '/dashbord' : '/login'" class="home-btn">
      <i class="fas fa-home"></i> {{ signedIn ? 'Go to dashboard' : 'Go to home page' }}
    </a>
  </div>
</div>
