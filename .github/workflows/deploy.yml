name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing works by force-pushing the built site to the gh-pages branch, which
# is the branch Pages serves from - so the only right this workflow needs is
# write access to the repository contents.
permissions:
  contents: write

# Never run two deployments at once, but let a newer commit finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The site is served from https://<user>.github.io/<repo>/, so every asset
      # URL has to be prefixed with the repo name.
      - name: Build
        run: npm run build -- --configuration production --base-href "/${GITHUB_REPOSITORY#*/}/"

      # GitHub Pages is a static file host with no SPA rewrite rule: a reload on
      # /dashbord would 404. Serving a copy of index.html as 404.html lets
      # Angular's router boot and resolve the deep link itself. .nojekyll stops
      # Pages from running the output through Jekyll, which would drop files
      # whose names begin with an underscore.
      - name: Add SPA fallback and disable Jekyll
        run: |
          cd dist/LostandFoundUI/browser
          cp index.html 404.html
          touch .nojekyll

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist/LostandFoundUI/browser
          git init -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
