name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN rights this workflow needs: read the repo, publish a Pages
# deployment, and mint the OIDC token deploy-pages authenticates with.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a newer commit finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # enablement:true turns Pages on the first time this runs, so the repo
      # needs no manual setup in Settings -> Pages.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is served from https://<user>.github.io/<repo>/, so every asset
      # URL has to be prefixed with the repo name.
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          BASE_HREF="${BASE_PATH%/}/"   # "/Lost-and-found-UI" -> "/Lost-and-found-UI/", "/" stays "/"
          echo "base-href: $BASE_HREF"
          npm run build -- --configuration production --base-href "$BASE_HREF"

      # GitHub Pages is a static file host with no SPA rewrite rule: a reload on
      # /dashbord would 404. Serving a copy of index.html as 404.html lets
      # Angular's router boot and resolve the deep link itself.
      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/LostandFoundUI/browser/index.html dist/LostandFoundUI/browser/404.html
          touch dist/LostandFoundUI/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/LostandFoundUI/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
